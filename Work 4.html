<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohde Bros Equipment Work Log</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f1419; color: #e5e7eb; margin: 0; padding: 0; }
.container { padding: 16px; max-width: 900px; margin: 0 auto; }
header { background: #1e3a5f; padding: 16px; text-align: center; }
.tabs { display: flex; background: #1a2332; border-radius: 12px; margin: 16px 0; overflow: hidden; }
.tab { flex: 1; padding: 14px 6px; text-align: center; background: #1a2332; color: #9ca3af; border: none; font-size: 14px; font-weight: 600; }
.tab.active { background: #3b82f6; color: white; }
.section { display: none; }
.section.active { display: block; }
.card { background: #1a2332; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
input, textarea { width: 100%; padding: 14px; background: #0f1419; border: 1px solid #2a3548; border-radius: 8px; color: white; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; }
button.save { background: #3b82f6; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: 600; }
.item { background: #1a2332; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
.badge { background: #3b82f6; color: white; padding: 3px 8px; border-radius: 6px; font-size: 13px; font-weight: 600; }
.junk { border-left: 4px solid #ef4444; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.stat { background: #1a2332; border-radius: 10px; padding: 16px; text-align: center; }
.stat-num { font-size: 22px; font-weight: 700; color: #3b82f6; }
.small { font-size: 13px; color: #9ca3af; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1 style="margin:0;font-size:20px">Rohde Bros Equipment Work Log</h1>
  <p style="margin:4px 0 0;color:#9ca3af;font-size:14px">Full Fleet</p>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="showTab('dashboard')">Dashboard</button>
    <button class="tab" onclick="showTab('log')">Add Work</button>
    <button class="tab" onclick="showTab('equipment')">Equipment</button>
    <button class="tab" onclick="showTab('history')">History</button>
  </div>

  <div id="dashboard" class="section active">
    <div class="stats" id="stats"></div>
    <div class="card">
      <input type="text" id="quickSearch" placeholder="Search unit (TK12, EX21, PU94...)" oninput="quickSearch(this.value)">
      <div id="quickResults"></div>
    </div>
  </div>

  <div id="log" class="section">
    <div class="card">
      <input type="date" id="logDate">
      <input type="text" id="logUnit" placeholder="Unit Number" list="unitList">
      <datalist id="unitList"></datalist>
      <input type="text" id="logTech" placeholder="Technician">
      <input type="number" id="logHours" placeholder="Hours" step="0.5">
      <textarea id="logWork" placeholder="Work performed"></textarea>
      <input type="text" id="logParts" placeholder="Parts used">
      <button class="save" onclick="saveLog()">Save Entry</button>
      <div id="msg" style="color:#10b981;margin-top:10px;display:none">Saved</div>
    </div>
  </div>

  <div id="equipment" class="section">
    <input type="text" id="equipSearch" placeholder="Search equipment..." oninput="filterEquipment(this.value)" style="margin-bottom:12px">
    <div id="equipmentList"></div>
  </div>

  <div id="history" class="section">
    <input type="text" id="historySearch" placeholder="Filter by unit..." oninput="filterHistory(this.value)" style="margin-bottom:12px">
    <div id="historyList"></div>
  </div>
</div>

let logs = JSON.parse(localStorage.getItem('rohdeLogs') || '[]');

function showTab(name) {
  var sections = document.querySelectorAll('.section');
  for (var i = 0; i < sections.length; i++) sections[i].classList.remove('active');
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  document.getElementById(name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'equipment') filterEquipment(document.getElementById('equipSearch').value);
  if (name === 'history') filterHistory(document.getElementById('historySearch').value);
  if (name === 'dashboard') updateStats();
}

function saveLog() {
  var entry = {
    date: document.getElementById('logDate').value,
    unit: document.getElementById('logUnit').value.toUpperCase().trim(),
    tech: document.getElementById('logTech').value.trim(),
    hours: parseFloat(document.getElementById('logHours').value) || 0,
    work: document.getElementById('logWork').value.trim(),
    parts: document.getElementById('logParts').value.trim()
  };
  if (!entry.unit || !entry.work) { alert('Unit number and work performed are required'); return; }
  logs.unshift(entry);
  localStorage.setItem('rohdeLogs', JSON.stringify(logs));
  document.getElementById('msg').style.display = 'block';
  setTimeout(function(){ document.getElementById('msg').style.display = 'none'; }, 1500);
  document.getElementById('logUnit').value = '';
  document.getElementById('logTech').value = '';
  document.getElementById('logHours').value = '';
  document.getElementById('logWork').value = '';
  document.getElementById('logParts').value = '';
  updateStats();
}

function filterEquipment(val) {
  var list = document.getElementById('equipmentList');
  var html = '';
  for (var i = 0; i < equipment.length; i++) {
    var e = equipment[i];
    if (!val || e.unit.toLowerCase().indexOf(val.toLowerCase()) >= 0 || e.desc.toLowerCase().indexOf(val.toLowerCase()) >= 0) {
      var junk = (e.status && e.status.indexOf('JUNK') >= 0) ? ' junk' : '';
      html += '<div class="item' + junk + '" onclick="viewUnit(\'' + e.unit + '\')"><span class="badge">' + e.unit + '</span> ' + e.desc;
      if (e.plate) html += '<div class="small">Plate: ' + e.plate + '</div>';
      if (e.status) html += '<div class="small" style="color:#f59e0b">' + e.status + '</div>';
      html += '</div>';
    }
  }
  list.innerHTML = html || '<div class="item">No results</div>';
}

function filterHistory(val) {
  var list = document.getElementById('historyList');
  var html = '';
  for (var i = 0; i < logs.length; i++) {
    var l = logs[i];
    if (!val || l.unit.toLowerCase().indexOf(val.toLowerCase()) >= 0) {
      html += '<div class="item"><div><span class="badge">' + l.unit + '</span> <span style="float:right;color:#9ca3af">' + (l.date||'') + '</span></div>';
      html += '<div style="margin-top:6px"><strong>' + (l.tech||'Unknown') + '</strong> • ' + (l.hours||0) + ' hrs</div>';
      html += '<div>' + (l.work||'') + '</div>';
      if (l.parts) html += '<div class="small">Parts: ' + l.parts + '</div>';
      html += '</div>';
    }
  }
  list.innerHTML = html || '<div class="item">No entries yet. Use the Add Work tab.</div>';
}

function viewUnit(unit) {
  showTab('history');
  document.getElementById('historySearch').value = unit;
  filterHistory(unit);
}

function quickSearch(val) {
  var results = document.getElementById('quickResults');
  if (!val) { results.innerHTML = ''; return; }
  var html = '';
  var count = 0;
  for (var i = 0; i < equipment.length && count < 8; i++) {
    var e = equipment[i];
    if (e.unit.toLowerCase().indexOf(val.toLowerCase()) >= 0 || e.desc.toLowerCase().indexOf(val.toLowerCase()) >= 0) {
      html += '<div class="item" onclick="viewUnit(\'' + e.unit + '\')" style="margin-top:8px"><span class="badge">' + e.unit + '</span> ' + e.desc + '</div>';
      count++;
    }
  }
  results.innerHTML = html || '<div style="padding:8px;color:#9ca3af">No matches</div>';
}

function updateStats() {
  var hours = 0;
  var units = {};
  for (var i = 0; i < logs.length; i++) {
    hours += parseFloat(logs[i].hours) || 0;
    if (logs[i].unit) units[logs[i].unit] = true;
  }
  var unitCount = 0;
  for (var k in units) unitCount++;
  document.getElementById('stats').innerHTML = 
    '<div class="stat"><div class="stat-num">' + logs.length + '</div><div>Entries</div></div>' +
    '<div class="stat"><div class="stat-num">' + hours.toFixed(1) + '</div><div>Hours</div></div>' +
    '<div class="stat"><div class="stat-num">' + unitCount + '</div><div>Units Worked</div></div>' +
    '<div class="stat"><div class="stat-num">' + equipment.length + '</div><div>Total Equipment</div></div>';
}

// Populate datalist
var dl = document.getElementById('unitList');
for (var i = 0; i < equipment.length; i++) {
  var opt = document.createElement('option');
  opt.value = equipment[i].unit;
  dl.appendChild(opt);
}

document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
updateStats();
filterEquipment('');
</script>
</body>
</html>
