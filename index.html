.container { padding: 16px; max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
header { 
  background: rgba(15,26,46,0.85); 
  padding: 28px 16px 22px; 
  text-align: center; 
  border-radius: 0 0 20px 20px;
  border: 1px solid rgba(30,58,95,0.4);
  backdrop-filter: blur(10px);
}
header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
header p { margin: 6px 0 0; color: #9bb0d0; font-size: 14px; font-weight: 500; }
.tabs { 
  display: flex; 
  background: rgba(15,26,46,0.8); 
  border-radius: 16px; 
  margin: 18px 0; 
  padding: 5px;
  border: 1px solid rgba(30,58,95,0.4);
  backdrop-filter: blur(8px);
}
.tab { 
  flex: 1; 
  padding: 13px 8px; 
  text-align: center; 
  background: transparent; 
  color: #9bb0d0; 
  border: none; 
  font-size: 14px; 
  font-weight: 600; 
  cursor: pointer; 
  border-radius: 12px;
  transition: all 0.2s;
}
.tab.active { background: #2563eb; color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
.section { display: none; }
.section.active { display: block; }
.card { 
  background: rgba(15,26,46,0.88); 
  border-radius: 18px; 
  padding: 18px; 
  margin-bottom: 14px; 
  border: 1px solid rgba(30,58,95,0.4);
  backdrop-filter: blur(8px);
}
input, textarea { 
  width: 100%; 
  padding: 14px 16px; 
  background: rgba(10,14,20,0.7); 
  border: 1px solid #2a4066; 
  border-radius: 12px; 
  color: white; 
  font-size: 16px; 
  margin-bottom: 12px; 
  outline: none;
}
input:focus, textarea:focus { border-color: #3b82f6; }
.btn-row { display: flex; gap: 10px; }
button.save { 
  background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%); 
  color: white; 
  border: none; 
  padding: 15px; 
  border-radius: 12px; 
  flex: 1;
  font-size: 16px; 
  font-weight: 600; 
}
button.delete { 
  background: #b91c1c; 
  color: white; 
  border: none; 
  padding: 15px 18px; 
  border-radius: 12px; 
  font-size: 16px; 
  font-weight: 600; 
}
.item { 
  background: rgba(15,26,46,0.88); 
  border-radius: 16px; 
  padding: 16px; 
  margin-bottom: 10px; 
  border: 1px solid rgba(30,58,95,0.4);
  display: flex; 
  justify-content: space-between; 
  align-items: center;
  backdrop-filter: blur(6px);
}
.item-content { flex: 1; cursor: pointer; }
.item-delete { background: #b91c1c; color: white; border: none; padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; margin-left: 10px; }
.badge { background: #2563eb; color: white; padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.stat { 
  background: rgba(15,26,46,0.88); 
  border-radius: 18px; 
  padding: 22px 16px; 
  text-align: center; 
  cursor: pointer; 
  border: 1px solid rgba(30,58,95,0.4);
  backdrop-filter: blur(6px);
}
.stat-num { font-size: 30px; font-weight: 700; color: #60a5fa; }
.stat div:last-child { color: #9bb0d0; font-size: 13px; margin-top: 4px; }
.small { font-size: 13px; color: #9bb0d0; margin-top: 6px; }
</style>

<body>
<header>
  <h1>Rohde Bros Equipment Work Log</h1>
  <p>Shared Fleet Log</p>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="show('dashboard', this)">Dashboard</button>
    <button class="tab" onclick="show('log', this)">Add Work</button>
    <button class="tab" onclick="show('equipment', this)">Equipment</button>
    <button class="tab" onclick="show('history', this)">History</button>
  </div>

  <div id="dashboard" class="section active">
    <div class="stats">
      <div class="stat" onclick="show('history')"><div class="stat-num" id="entryCount">0</div><div>Entries</div></div>
      <div class="stat" onclick="show('equipment')"><div class="stat-num" id="equipCount">0</div><div>Equipment</div></div>
    </div>
    <div class="card">
      <input type="text" id="quickSearch" placeholder="Search unit..." oninput="doSearch(this.value)">
      <div id="quickResults"></div>
    </div>
  </div>

  <div id="log" class="section">
    <div class="card">
      <input type="hidden" id="editId">
      <input type="date" id="logDate">
      <input type="text" id="logUnit" placeholder="Unit Number">
      <input type="text" id="logTech" placeholder="Technician">
      <input type="number" id="logHours" placeholder="Hours" step="0.5">
      <textarea id="logWork" placeholder="Work performed"></textarea>
      <input type="text" id="logParts" placeholder="Parts used">
      <textarea id="logNotes" placeholder="Notes"></textarea>
      <div class="btn-row">
        <button class="save" onclick="saveLog()" id="saveBtn">Save Entry</button>
        <button class="delete" onclick="deleteEntry()" id="deleteBtn" style="display:none">Delete</button>
      </div>
      <div id="msg" style="color:#34d399;margin-top:12px;display:none">Saved</div>
      <div id="errorMsg" style="color:#f87171;margin-top:12px;display:none"></div>
    </div>
  </div>

  <div id="equipment" class="section">
    <input type="text" id="equipSearch" placeholder="Search equipment..." oninput="filterEq(this.value)" style="margin-bottom:14px">
    <div id="equipmentList"></div>
  </div>

  <div id="history" class="section">
    <input type="text" id="historySearch" placeholder="Filter by unit..." oninput="filterHist(this.value)" style="margin-bottom:14px">
    <div id="historyList" onclick="handleHistoryClick(event)"></div>
  </div>
</div>

var logs = [];

function show(name, btn) {
  var secs = document.querySelectorAll('.section');
  for (var i = 0; i < secs.length; i++) secs[i].classList.remove('active');
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  document.getElementById(name).classList.add('active');
  if (btn) btn.classList.add('active');
  if (name === 'history') loadLogs();
  if (name === 'equipment') filterEq('');
}

function viewUnit(unit) {
  show('history');
  document.getElementById('historySearch').value = unit;
  filterHist(unit);
}

function handleHistoryClick(e) {
  var target = e.target;
  while (target && target !== document.getElementById('historyList')) {
    if (target.classList && target.classList.contains('item-delete')) {
      var id = target.getAttribute('data-id');
      if (id) deleteEntry(id);
      e.stopPropagation();
      return;
    }
    if (target.classList && target.classList.contains('item-content')) {
      var id = target.getAttribute('data-id');
      if (id) editEntry(id);
      return;
    }
    target = target.parentElement;
  }
}

function editEntry(id) {
  var entry = null;
  for (var i = 0; i < logs.length; i++) {
    if (String(logs[i].id) === String(id)) { entry = logs[i]; break; }
  }
  if (!entry) return;
  document.getElementById('editId').value = entry.id;
  document.getElementById('logDate').value = entry.Date || '';
  document.getElementById('logUnit').value = entry.Unit || '';
  document.getElementById('logTech').value = entry.Tech || '';
  document.getElementById('logHours').value = entry.Hours || '';
  document.getElementById('logWork').value = entry.Work || '';
  document.getElementById('logParts').value = entry.Parts || '';
  document.getElementById('logNotes').value = entry.Notes || '';
  document.getElementById('saveBtn').textContent = 'Update Entry';
  document.getElementById('deleteBtn').style.display = 'block';
  show('log');
}

function deleteEntry(id) {
  var targetId = id || document.getElementById('editId').value;
  if (!targetId) return;
  
  logs = logs.filter(function(l) { return String(l.id) !== String(targetId); });
  filterHist(document.getElementById('historySearch').value);
  updateStats();
  
  supabase.from('Work logs').delete().eq('id', targetId).then(function(res) {
    if (res.error) {
      alert('Delete failed');
      loadLogs();
    }
  });
}

function loadLogs() {
  var list = document.getElementById('historyList');
  if (!supabase) { list.innerHTML = '<div class="item">Database not connected</div>'; return; }
  list.innerHTML = '<div class="item">Loading...</div>';
  supabase.from('Work logs').select('*').order('created_at', { ascending: false }).then(function(res) {
    if (res.error) {
      list.innerHTML = '<div class="item">Load error: ' + res.error.message + '</div>';
      return;
    }
    logs = res.data || [];
    filterHist(document.getElementById('historySearch').value);
    updateStats();
  });
}

function saveLog() {
  document.getElementById('errorMsg').style.display = 'none';
  if (!supabase) { showError('No database connection'); return; }

  var unitVal = document.getElementById('logUnit').value.trim();
  var workVal = document.getElementById('logWork').value.trim();
  var editId = document.getElementById('editId').value;

  if (!unitVal || !workVal) { 
    showError('Unit and work are required'); 
    return; 
  }

  var entry = {
    created_at: new Date().toISOString(),
    Date: document.getElementById('logDate').value || null,
    Unit: unitVal.toUpperCase(),
    Tech: document.getElementById('logTech').value.trim(),
    Hours: parseFloat(document.getElementById('logHours').value) || 0,
    Work: workVal,
    Parts: document.getElementById('logParts').value.trim(),
    Notes: document.getElementById('logNotes').value.trim()
  };

  var promise = editId 
    ? supabase.from('Work logs').update(entry).eq('id', editId)
    : supabase.from('Work logs').insert([entry]);

  promise.then(function(res) {
    if (res.error) { 
      showError('Save failed: ' + res.error.message); 
      return; 
    }
    document.getElementById('msg').style.display = 'block';
    document.getElementById('msg').textContent = editId ? 'Updated' : 'Saved';
    setTimeout(function(){ document.getElementById('msg').style.display = 'none'; }, 1500);
    document.getElementById('editId').value = '';
    document.getElementById('logUnit').value = '';
    document.getElementById('logTech').value = '';
    document.getElementById('logHours').value = '';
    document.getElementById('logWork').value = '';
    document.getElementById('logParts').value = '';
    document.getElementById('logNotes').value = '';
    document.getElementById('saveBtn').textContent = 'Save Entry';
    document.getElementById('deleteBtn').style.display = 'none';
    loadLogs();
    show('history');
  });
}

function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function filterEq(val) {
  var list = document.getElementById('equipmentList');
  var html = '';
  for (var i = 0; i < equipment.length; i++) {
    var e = equipment[i];
    if (!val || e.unit.toLowerCase().indexOf(val.toLowerCase()) >= 0 || e.desc.toLowerCase().indexOf(val.toLowerCase()) >= 0) {
      html += '<div class="item" onclick="viewUnit(\'' + e.unit + '\')"><div class="item-content"><span class="badge">' + e.unit + '</span> ' + e.desc + '</div></div>';
    }
  }
  list.innerHTML = html || '<div class="item">No results</div>';
}

function filterHist(val) {
  var list = document.getElementById('historyList');
  var html = '';
  for (var i = 0; i < logs.length; i++) {
    var l = logs[i];
    var unit = l.Unit || '';
    var work = l.Work || '';
    var date = l.Date || '';
    var tech = l.Tech || '';
    if (!val || unit.toLowerCase().indexOf(val.toLowerCase()) >= 0) {
      html += '<div class="item">' +
        '<div class="item-content" data-id="' + l.id + '">' +
          '<span class="badge">' + unit + '</span> ' + work +
          '<div class="small">' + date + ' • ' + tech + '</div>' +
        '</div>' +
        '<button class="item-delete" data-id="' + l.id + '">Delete</button>' +
      '</div>';
    }
  }
  list.innerHTML = html || '<div class="item">No entries yet</div>';
}

function doSearch(val) {
  var results = document.getElementById('quickResults');
  if (!val) { results.innerHTML = ''; return; }
  var html = '';
  for (var i = 0; i < equipment.length; i++) {
    var e = equipment[i];
    if (e.unit.toLowerCase().indexOf(val.toLowerCase()) >= 0 || e.desc.toLowerCase().indexOf(val.toLowerCase()) >= 0) {
      html += '<div class="item" onclick="viewUnit(\'' + e.unit + '\')"><div class="item-content"><span class="badge">' + e.unit + '</span> ' + e.desc + '</div></div>';
    }
  }
  results.innerHTML = html || '<div class="item">No matches</div>';
}

function updateStats() {
  document.getElementById('entryCount').textContent = logs.length;
  document.getElementById('equipCount').textContent = equipment.length;
}

document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
filterEq('');
updateStats();
</script>
